[project]
name = "alberta-well-assistant"
version = "0.1.0"
description = "Plain-English Q&A over Alberta Energy Regulator well data"
readme = "README.md"
authors = [
    { name = "KachiYD" }
]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[project.scripts]
alberta-well-assistant = "alberta_well_assistant:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
